[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "phishbench"
version = "0.1.0"
description = "Reproducible evaluation of injection-first staged inference for LLM phishing detection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110.0",
  "httpx>=0.28.0",
  "joblib>=1.3.0",
  "numpy>=1.26.0",
  "onnxruntime>=1.18.0",
  "pydantic>=2.6.0",
  "pytest>=8.0.0",
  "scikit-learn>=1.4.0",
  "tldextract>=5.1.0",
  "tokenizers>=0.19.0",
  "uvicorn>=0.28.0",
  "huggingface_hub>=0.23.0",
]

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
research = [
  "faiss-cpu>=1.8.0",
  "sentence-transformers>=3.0.0",
  "torch>=2.2.0",
]

[project.scripts]
phishbench-run = "phishbench.runner:main"
phishbench-freeze-prompts = "phishbench.freeze_prompts:main"
phishbench-validate = "phishbench.validate_artifacts:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
